<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="icons/icon32.png">
<title>Extracted element</title>
<style>
  :root { --bg: #f1f5f9; --card: #fff; --text: #0f172a; --border: #cbd5e1; --muted: #64748b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155; --muted: #94a3b8; } }
  body { font-family: 'Segoe UI', system-ui, Arial, sans-serif; margin: 0; padding: 20px; background: var(--bg); color: var(--text); }
  h2 { margin: 0 0 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button, .actions button, .modes button {
    padding: 9px 20px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 999px; cursor: pointer; font: 600 14px 'Segoe UI', system-ui, Arial, sans-serif;
    transition: filter .12s ease, transform .12s ease;
  }
  .tabs button:hover, .actions button:hover, .modes button:hover { filter: brightness(.97); transform: translateY(-1px); }
  .tabs button.on, .modes button.on { background: #2563eb; color: #fff; border-color: #2563eb; }
  .actions { margin: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button.primary { background: #059669; color: #fff; border-color: #059669; }
  textarea {
    width: 100%; height: 66vh; box-sizing: border-box; font: 13px/1.55 Consolas, 'Cascadia Code', monospace;
    padding: 14px; border-radius: 18px; border: 1px solid var(--border); background: var(--card); color: var(--text); resize: vertical;
  }
  .pv-slot { height: 66vh; }
  .pv-stage { position: relative; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: #fff; border: 1px solid var(--border); box-sizing: border-box; }
  .pv-stage iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .pv-stage.expanded { position: fixed; top: 5vh; left: 5vw; width: 90vw; height: 90vh; z-index: 101; border-radius: 26px; border-color: transparent; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); animation: pop .22s ease; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  #expand { position: absolute; top: 14px; right: 14px; z-index: 5; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: #fff; color: #1f2937; cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0, 0, 0, .28); transition: transform .12s ease; }
  #expand:hover { transform: scale(1.06); }
  #expand svg { grid-area: 1 / 1; }
  #expand .i-expand, #expand .i-close { transform-box: fill-box; transform-origin: center; transition: transform .25s ease, opacity .2s ease; }
  #expand .i-close { opacity: 0; transform: rotate(-90deg) scale(.5); }
  .expanded #expand .i-expand { opacity: 0; transform: rotate(90deg) scale(.5); }
  .expanded #expand .i-close { opacity: 1; transform: none; }
  #backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(15, 23, 42, .45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  #backdrop.on { opacity: 1; pointer-events: auto; }
  #pstatus { font-size: 12px; color: var(--muted); margin-top: 8px; }
  #pconsole { margin-top: 8px; font: 12px/1.6 Consolas, monospace; color: #b91c1c; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; max-height: 140px; overflow: auto; white-space: pre-wrap; direction: ltr; text-align: left; }
  #pconsole[hidden] { display: none; }
  .modes { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .modes button { padding: 6px 16px; font-size: 13px; }
  .pane { display: none; } .pane.on { display: block; }
  .info-wrap { position: relative; margin-left: auto; }
  #notes {
    position: absolute; right: 0; top: calc(100% + 10px); width: min(760px, 88vw); z-index: 50; box-sizing: border-box;
    font-size: 12px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a;
    padding: 14px 18px; border-radius: 18px; line-height: 1.7; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  }
  #notes[hidden] { display: none; }
</style>
</head>
<body>
  <h2>Extracted element</h2>
  <div class="tabs">
    <button data-t="html" class="on">HTML</button>
    <button data-t="css">CSS</button>
    <button data-t="js">JavaScript</button>
    <button data-t="prev">Preview</button>
    <div class="info-wrap">
      <button id="info" type="button">Info</button>
      <div id="notes" hidden></div>
    </div>
  </div>
  <div class="actions">
    <button id="copy">Copy</button>
    <button id="zip" class="primary">Download ZIP (code + assets)</button>
    <button id="zipacc" class="primary">Download accurate snapshot (ZIP + assets)</button>
  </div>
  <div class="pane on" id="p-html"><textarea id="t-html" readonly></textarea></div>
  <div class="pane" id="p-css"><textarea id="t-css" readonly></textarea></div>
  <div class="pane" id="p-js"><textarea id="t-js" readonly></textarea></div>
  <div class="pane" id="p-prev">
    <div class="modes">
      <button id="m-live">Live (HTML + CSS + JS)</button>
      <button id="m-ext">HTML + CSS only (no JS)</button>
      <button id="m-acc">Pixel-accurate snapshot</button>
    </div>
    <div class="pv-slot">
      <div class="pv-stage" id="stage">
        <iframe id="frame"></iframe>
        <button id="expand" type="button" aria-label="Expand preview" title="Expand preview">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <g class="i-expand"><path d="M14 5h5v5"/><path d="M10 19H5v-5"/></g>
            <g class="i-close"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></g>
          </svg>
        </button>
      </div>
    </div>
    <div id="pstatus"></div>
    <div id="pconsole" hidden></div>
  </div>
  <div id="backdrop"></div>
  <script src="jszip.min.js"></script>
  <script src="result.js"></script>
</body>
</html>
